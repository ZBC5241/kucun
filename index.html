<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b6cff"><title>库存工作台 V2.1</title><style>
:root{--blue:#0b6cff;--bg:#f5f7fa;--card:#fff;--text:#172033;--muted:#748096;--line:#e7ebf2;--green:#159a68;--orange:#e88900;--red:#e54343;--shadow:0 8px 28px rgba(25,45,80,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{background:linear-gradient(135deg,#075fdc,#1249bf);color:#fff;padding:18px max(16px,calc((100vw - 1180px)/2)) 32px}.hero,.main{max-width:1180px;margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:850;font-size:22px}.sub{font-size:12px;opacity:.75;margin-top:4px}.tools{display:flex;gap:8px}.tools button,.ghost{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;border-radius:11px;padding:9px 12px}.search{margin-top:20px;background:#fff;padding:6px;border-radius:17px;display:flex;gap:5px;box-shadow:0 14px 35px #003b8b55}.search input{flex:1;min-width:0;border:0;outline:0;padding:13px 12px;font-size:16px}.search button{border:0;border-radius:12px;background:var(--blue);color:#fff;padding:0 18px;font-weight:750}.main{margin-top:-8px;padding:0 16px 90px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:11px}.stat{background:#fff;border-radius:16px;padding:15px;box-shadow:var(--shadow)}.num{font-size:24px;font-weight:850}.lab{font-size:12px;color:var(--muted);margin-top:5px}.panel{background:#fff;border-radius:16px;padding:13px;box-shadow:var(--shadow);margin-top:14px}.chips,.row{display:flex;gap:8px;flex-wrap:wrap}.chips{overflow:auto;flex-wrap:nowrap;padding-bottom:2px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;color:#536075}.chip.active{background:#eaf2ff;border-color:#c8dcff;color:var(--blue);font-weight:750}.row{margin-top:10px}.row select,.row button{border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px 10px;color:#536075}.section{margin-top:19px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.head h2{margin:0;font-size:17px}.head span{font-size:12px;color:var(--muted)}.results{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fff;border-radius:17px;padding:16px;box-shadow:var(--shadow);border:1px solid transparent}.card:hover{border-color:#cfe0ff}.phead{display:flex;justify-content:space-between;gap:10px}.name{font-size:17px;font-weight:850}.meta{font-size:12px;color:var(--muted);margin-top:4px}.badge{font-size:12px;border-radius:999px;padding:5px 9px;white-space:nowrap}.ok{background:#e9f8f1;color:var(--green)}.low{background:#fff5e4;color:#b66a00}.out{background:#fff0f0;color:var(--red)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:14px 0}.cell{background:#f7f9fc;border-radius:11px;padding:9px}.cell b{display:block;font-size:17px}.cell span{font-size:10px;color:var(--muted)}.colors{display:flex;gap:6px;flex-wrap:wrap}.color{font-size:12px;background:#f5f7fa;border-radius:8px;padding:6px 8px}.actions{display:flex;gap:7px;margin-top:13px}.actions button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px;color:#536075}.actions .primary{background:#edf5ff;color:var(--blue);border-color:#d5e5ff}.empty{grid-column:1/-1;background:#fff;border-radius:16px;padding:50px;text-align:center;color:var(--muted)}.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.quick button{border:0;background:#fff;border-radius:14px;padding:14px 8px;box-shadow:var(--shadow);color:#344054}.quick strong{display:block;font-size:20px}.quick small{display:block;color:var(--muted);margin-top:4px}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);opacity:0;background:#172033;color:#fff;border-radius:12px;padding:11px 16px;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}dialog{border:0;border-radius:20px;width:min(620px,92vw);box-shadow:0 24px 70px #0004;padding:0}.modal{padding:20px}.modal header{display:flex;justify-content:space-between;align-items:center}.modal h3{margin:0}.x{border:0;background:#f2f4f7;border-radius:10px;width:36px;height:36px}.detailgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:16px 0}.detailitem{background:#f7f9fc;border-radius:12px;padding:11px}.detailitem small{display:block;color:var(--muted);margin-bottom:5px}.history{border-top:1px solid var(--line);margin-top:15px;padding-top:12px}.history div{padding:9px 0;border-bottom:1px solid #f0f2f5;font-size:13px}.import{display:none}@media(max-width:760px){.top{padding:16px 12px 27px}.main{padding:0 11px 90px}.brand{font-size:19px}.tools button{padding:8px}.tools button:first-child{display:none}.stats{grid-template-columns:repeat(2,1fr)}.results{grid-template-columns:1fr}.quick{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(4,1fr)}.row select:nth-child(3){display:none}.search button{padding:0 13px}.sub{max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
</style></head><body><header class="top"><div class="hero"><div class="bar"><div><div class="brand">📦 库存工作台 <small style="font-size:11px;opacity:.7">V2.1</small></div><div class="sub" id="updated">全品类库存 · 极速查询 · 智能预警</div></div><div class="tools"><button onclick="exportData()">导出</button><button onclick="document.getElementById('file').click()">导入</button><button onclick="sync()">↻ 同步</button></div></div><div class="search"><input id="q" autocomplete="off" placeholder="搜索商品 / 型号 / SN / 条码 / 关键词" oninput="render()" onkeydown="if(event.key==='Enter')rememberQuery()"><button onclick="rememberQuery();render()">查询</button></div></div></header><main class="main"><section class="stats"><div class="stat"><div class="num" id="total">0</div><div class="lab">库存总量</div></div><div class="stat"><div class="num" id="sale">0</div><div class="lab">可售库存</div></div><div class="stat"><div class="num" id="warn">0</div><div class="lab">低库存商品</div></div><div class="stat"><div class="num" id="out">0</div><div class="lab">缺货商品</div></div><div class="stat"><div class="num" id="stores">0</div><div class="lab">库存门店</div></div></section><section class="panel"><div class="chips" id="chips"></div><div class="row"><select id="status" onchange="render()"><option value="">全部状态</option><option value="ok">有货</option><option value="low">低库存</option><option value="out">缺货</option></select><select id="store" onchange="render()"><option value="">全部门店</option></select><select id="sort" onchange="render()"><option value="name">按名称排序</option><option value="stock">库存从高到低</option><option value="available">可售从高到低</option></select><button onclick="clearFilters()">重置筛选</button></div></section><section class="section"><div class="head"><h2>库存查询</h2><span id="count"></span></div><div class="results" id="results"></div></section><section class="section"><div class="head"><h2>快捷入口</h2></div><div class="quick"><button onclick="setStatus('low')"><strong>🔴</strong><small>库存预警</small></button><button onclick="setStatus('out')"><strong>⚠️</strong><small>缺货商品</small></button><button onclick="showRecent()"><strong>⭐</strong><small>最近查询</small></button><button onclick="focusSearch()"><strong>📷</strong><small>扫码查询</small></button><button onclick="showFavorites()"><strong>♥</strong><small>常用商品</small></button></div></section></main><input class="import" id="file" type="file" accept="application/json,.json" onchange="importData(event)"><div class="toast" id="toast"></div><dialog id="dialog"><div class="modal"><header><h3 id="dt">库存详情</h3><button class="x" onclick="dialog.close()">×</button></header><div id="detail"></div></div></dialog><script>
const fallback=[{id:'x6',name:'Mate X6',model:'ALT-AL10',category:'手机',spec:'12GB+512GB',stock:15,available:14,reserved:1,transit:3,store:'总部仓',colors:['曜石黑 5','冰川蓝 8','红色 2'],updated:'2026-08-24 16:32',history:['08-24 入库 +5','08-24 客户预留 -1','08-23 销售 -2']},{id:'p80',name:'Pura 80 Pro',model:'HMA-AL00',category:'手机',spec:'16GB+512GB',stock:8,available:7,reserved:1,transit:2,store:'总部仓',colors:['曜金黑 3','雪域白 5'],updated:'2026-08-24 15:18'},{id:'mp',name:'MatePad Pro',model:'WGR-AL09',category:'平板',spec:'12GB+512GB',stock:5,available:5,reserved:0,transit:1,store:'大茂城店',colors:['曜石黑 3','星河蓝 2'],updated:'2026-08-24 14:42'},{id:'fb',name:'FreeBuds Pro',model:'T0010',category:'音频',spec:'旗舰降噪',stock:2,available:2,reserved:0,transit:6,store:'大茂城店',colors:['黑色 2'],updated:'2026-08-24 12:10'},{id:'w5',name:'WATCH 5',model:'LNA-B19',category:'穿戴',spec:'46mm',stock:0,available:0,reserved:0,transit:4,store:'总部仓',colors:[],updated:'2026-08-24 10:08'}];
let data=Array.isArray(window.STOCK_DATA)?window.STOCK_DATA:(JSON.parse(localStorage.getItem('kucun_v21_data')||'null')||fallback),cat='全部',recent=JSON.parse(localStorage.getItem('kucun_recent')||'[]'),favorites=JSON.parse(localStorage.getItem('kucun_fav')||'[]');const $=id=>document.getElementById(id);function s(x){let n=Number(x.available??x.stock??0);return n<=0?'out':n<=3?'low':'ok'}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function categories(){return ['全部',...new Set(data.map(x=>x.category).filter(Boolean))]}function render(){let q=$('q').value.trim().toLowerCase(),st=$('status').value,store=$('store').value,sort=$('sort').value;$('chips').innerHTML=categories().map(c=>`<button class="chip ${cat===c?'active':''}" onclick="cat=${JSON.stringify(c)};render()">${esc(c)}</button>`).join('');let stores=[...new Set(data.map(x=>x.store).filter(Boolean))];$('store').innerHTML='<option value="">全部门店</option>'+stores.map(v=>`<option ${v===store?'selected':''}>${esc(v)}</option>`).join('');let a=data.filter(x=>(cat==='全部'||x.category===cat)&&(!st||s(x)===st)&&(!store||x.store===store)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));a.sort((a,b)=>sort==='stock'?(b.stock||0)-(a.stock||0):sort==='available'?((b.available??b.stock??0)-(a.available??a.stock??0)):(a.name||'').localeCompare(b.name||'','zh-CN'));$('count').textContent=`${a.length} 个商品`;$('results').innerHTML=a.length?a.map(card).join(''):'<div class="empty">没有找到匹配库存<br><small>试试商品名、型号、SN、条码或其他关键词</small></div>';stats(stores.length)}function card(x){let z=s(x),label=z==='ok'?'有货':z==='low'?'库存偏低':'缺货',fav=favorites.includes(x.id);return `<article class="card"><div class="phead"><div><div class="name">${esc(x.name)} ${fav?'<span style="color:#e54343;font-size:14px">♥</span>':''}</div><div class="meta">${esc(x.model||'-')} · ${esc(x.spec||'-')} · ${esc(x.store||'未分配门店')}</div></div><span class="badge ${z}">${label}</span></div><div class="grid"><div class="cell"><b>${x.stock||0}</b><span>库存</span></div><div class="cell"><b>${x.available??x.stock??0}</b><span>可售</span></div><div class="cell"><b>${x.reserved||0}</b><span>预留</span></div><div class="cell"><b>${x.transit||0}</b><span>在途</span></div></div><div class="colors">${(x.colors||[]).map(v=>`<span class="color">● ${esc(v)}</span>`).join('')||'<span class="color">暂无颜色明细</span>'}</div><div class="actions"><button class="primary" onclick="detail(${data.indexOf(x)})">查看详情</button><button onclick="copyStock(${data.indexOf(x)})">客户回复</button><button onclick="toggleFav('${esc(x.id||data.indexOf(x))}')">${fav?'取消常用':'设为常用'}</button></div></article>`}function stats(n){$('total').textContent=data.reduce((a,x)=>a+(+x.stock||0),0);$('sale').textContent=data.reduce((a,x)=>a+(+(x.available??x.stock)||0),0);$('warn').textContent=data.filter(x=>s(x)==='low').length;$('out').textContent=data.filter(x=>s(x)==='out').length;$('stores').textContent=n}function detail(i){let x=data[i];$('dt').textContent=x.name;$('detail').innerHTML=`<div class="detailgrid"><div class="detailitem"><small>型号</small><b>${esc(x.model||'-')}</b></div><div class="detailitem"><small>规格</small><b>${esc(x.spec||'-')}</b></div><div class="detailitem"><small>所属门店</small><b>${esc(x.store||'-')}</b></div><div class="detailitem"><small>最后更新</small><b>${esc(x.updated||'-')}</b></div><div class="detailitem"><small>SN</small><b>${esc(x.sn||'-')}</b></div><div class="detailitem"><small>条码</small><b>${esc(x.barcode||'-')}</b></div></div><div class="history"><b>库存记录</b>${(x.history||['暂无库存变动记录']).map(v=>`<div>${esc(v)}</div>`).join('')}</div><div class="actions" style="margin-top:16px"><button class="primary" onclick="copyStock(${i})">复制客户回复</button><button onclick="dialog.close()">关闭</button></div>`;$('dialog').showModal()}function copyStock(i){let x=data[i],n=x.available??x.stock??0,text=n>0?`${x.name} ${x.spec||''} 目前有货，可售${n}台，如需可以帮您预留。`:`${x.name} ${x.spec||''} 目前暂无现货，目前在途${x.transit||0}台。`;navigator.clipboard?.writeText(text);toast('已复制客户回复')}function toggleFav(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];localStorage.setItem('kucun_fav',JSON.stringify(favorites));render()}function rememberQuery(){let q=$('q').value.trim();if(q){recent=[q,...recent.filter(x=>x!==q)].slice(0,12);localStorage.setItem('kucun_recent',JSON.stringify(recent))}}function showRecent(){if(!recent.length)return toast('暂时没有最近查询');$('q').value=recent.join(' ');toast('已载入最近查询，可继续编辑')}function showFavorites(){let ids=new Set(favorites);$('q').value='';cat='全部';$('status').value='';$('store').value='';$('results').innerHTML=data.filter(x=>ids.has(x.id)).map(card).join('')||'<div class="empty">还没有常用商品</div>';$('count').textContent=`${favorites.length} 个常用商品`}function setStatus(v){$('status').value=v;render();scrollTo({top:240,behavior:'smooth'})}function clearFilters(){cat='全部';$('q').value='';$('status').value='';$('store').value='';$('sort').value='name';render()}function focusSearch(){focusSearchCore()}function focusSearchCore(){$('q').focus()}function sync(){localStorage.setItem('kucun_v21_data',JSON.stringify(data));$('updated').textContent='已同步：'+new Date().toLocaleString('zh-CN',{hour12:false});toast('库存数据已同步到本机')}function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kucun-stock.json';a.click();URL.revokeObjectURL(a.href);toast('库存数据已导出')}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x))throw 0;data=x;localStorage.setItem('kucun_v21_data',JSON.stringify(data));render();toast('库存数据导入成功')}catch{toast('导入失败：请选择正确的 JSON 数组')}};r.readAsText(f,'utf-8')}function toast(t){let e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();focusSearchCore()}});render();
</script></body></html>
