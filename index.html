<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b6cff"><title>库存工作台 V2.0</title>
<style>
:root{--blue:#0b6cff;--bg:#f5f7fa;--card:#fff;--text:#172033;--muted:#748096;--line:#e9edf3;--green:#19a974;--orange:#f59e0b;--red:#ef4444;--shadow:0 8px 28px rgba(30,55,90,.08);--r:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{background:linear-gradient(135deg,#0b6cff,#1554d8);color:#fff;padding:20px max(18px,calc((100vw - 1180px)/2)) 34px}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:22px;font-weight:800}.sub{font-size:12px;opacity:.72;margin-top:4px}.sync{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);color:#fff;border-radius:12px;padding:9px 12px}.hero{max-width:1180px;margin:0 auto}.search{margin-top:24px;background:#fff;border-radius:16px;padding:6px;display:flex;box-shadow:0 14px 35px rgba(0,0,0,.16)}.search input{border:0;outline:0;flex:1;min-width:0;padding:13px 14px;color:var(--text);font-size:16px}.search button{border:0;background:var(--blue);color:#fff;border-radius:12px;padding:0 20px;font-weight:700}.main{max-width:1180px;margin:-10px auto 0;padding:0 18px 100px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:var(--card);border-radius:16px;padding:17px;box-shadow:var(--shadow)}.stat .n{font-size:25px;font-weight:800}.stat .l{font-size:12px;color:var(--muted);margin-top:5px}.filters{margin-top:16px;background:var(--card);padding:14px;border-radius:16px;box-shadow:var(--shadow)}.chips{display:flex;gap:8px;overflow:auto}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;color:#536075}.chip.active{background:#eaf2ff;color:var(--blue);border-color:#bcd3ff;font-weight:700}.advanced{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.advanced select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;color:#536075}.section{margin-top:20px}.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:10px}.section-head h2{font-size:17px;margin:0}.section-head span{font-size:12px;color:var(--muted)}.results{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.product{background:#fff;border-radius:16px;padding:16px;box-shadow:var(--shadow);border:1px solid transparent}.product:hover{border-color:#dbe7ff}.phead{display:flex;justify-content:space-between;gap:12px}.name{font-size:17px;font-weight:800}.model{font-size:12px;color:var(--muted);margin-top:4px}.badge{font-size:12px;padding:5px 9px;border-radius:999px;white-space:nowrap}.ok{background:#eaf9f2;color:var(--green)}.low{background:#fff7e6;color:#c27a00}.out{background:#fff0f0;color:var(--red)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.cell{background:#f7f9fc;border-radius:12px;padding:10px}.cell b{display:block;font-size:18px}.cell span{font-size:11px;color:var(--muted)}.colors{display:flex;gap:7px;flex-wrap:wrap}.color{font-size:12px;background:#f6f7f9;border-radius:8px;padding:6px 8px}.actions{display:flex;gap:8px;margin-top:13px}.actions button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px;color:#536075}.actions .primary{background:#eef5ff;color:var(--blue);border-color:#d4e4ff}.empty{text-align:center;padding:45px 10px;color:var(--muted);background:#fff;border-radius:16px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.quick button{border:0;background:#fff;border-radius:15px;padding:16px 10px;box-shadow:var(--shadow);color:#344054}.quick strong{display:block;font-size:20px;margin-bottom:5px}.quick small{color:var(--muted)}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#172033;color:#fff;padding:11px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:760px){.top{padding:16px 14px 28px}.main{padding:0 12px 90px}.stats{grid-template-columns:repeat(2,1fr)}.results{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,1fr)}.advanced{display:none}.brand{font-size:19px}.search button{padding:0 15px}.grid{grid-template-columns:repeat(3,1fr)}}
</style></head>
<body><div class="app"><header class="top"><div class="hero"><div class="bar"><div><div class="brand">📦 库存工作台</div><div class="sub">全品类库存 · 快速查询 · 门店工作台</div></div><button class="sync" onclick="sync()">↻ 同步</button></div><div class="search"><input id="q" autocomplete="off" placeholder="搜索商品 / 型号 / SN / 条码 / 关键词" oninput="render()"><button onclick="focusSearch()">查询</button></div></div></header><main class="main"><section class="stats"><div class="stat"><div class="n" id="total">0</div><div class="l">库存总量</div></div><div class="stat"><div class="n" id="sale">0</div><div class="l">可售库存</div></div><div class="stat"><div class="n" id="warn">0</div><div class="l">低库存</div></div><div class="stat"><div class="n" id="out">0</div><div class="l">缺货商品</div></div></section><section class="filters"><div class="chips" id="chips"></div><div class="advanced"><select id="status" onchange="render()"><option value="">库存状态</option><option value="ok">有货</option><option value="low">低库存</option><option value="out">缺货</option></select><select id="sort" onchange="render()"><option value="name">按名称</option><option value="stock">按库存</option></select></div></section><section class="section"><div class="section-head"><h2 id="title">库存查询</h2><span id="count"></span></div><div class="results" id="results"></div></section><section class="section"><div class="section-head"><h2>快捷入口</h2></div><div class="quick"><button onclick="setStatus('low')"><strong>🔴</strong><small>库存预警</small></button><button onclick="setStatus('out')"><strong>⚠️</strong><small>缺货商品</small></button><button onclick="showRecent()"><strong>⭐</strong><small>最近查询</small></button><button onclick="focusSearch()"><strong>📷</strong><small>扫码查询</small></button></div></section></main></div><div class="toast" id="toast"></div>
<script>
/* 数据适配层：如原系统已有数据，可将 window.STOCK_DATA 注入为数组。字段支持 name/model/category/color/spec/stock/available/reserved/transit/sn/barcode。 */
const demo=[
{name:'Mate X6',model:'ALT-AL10',category:'手机',spec:'12GB+512GB',stock:15,available:14,reserved:1,transit:3,colors:['曜石黑 5','冰川蓝 8','红色 2']},
{name:'Pura 80 Pro',model:'HMA-AL00',category:'手机',spec:'16GB+512GB',stock:8,available:7,reserved:1,transit:2,colors:['曜金黑 3','雪域白 5']},
{name:'MatePad Pro',model:'WGR-AL09',category:'平板',spec:'12GB+512GB',stock:5,available:5,reserved:0,transit:1,colors:['曜石黑 3','星河蓝 2']},
{name:'FreeBuds Pro',model:'T0010',category:'音频',spec:'旗舰降噪',stock:2,available:2,reserved:0,transit:6,colors:['黑色 2']},
{name:'WATCH 5',model:'LNA-B19',category:'穿戴',spec:'46mm',stock:0,available:0,reserved:0,transit:4,colors:[]}
];
let data=Array.isArray(window.STOCK_DATA)?window.STOCK_DATA:demo;let cat='全部';
const cats=['全部',...new Set(data.map(x=>x.category).filter(Boolean))];
function status(x){return x.stock<=0?'out':x.stock<=3?'low':'ok'}
function render(){const q=(document.getElementById('q').value||'').trim().toLowerCase(),st=document.getElementById('status').value,sort=document.getElementById('sort').value;document.getElementById('chips').innerHTML=cats.map(c=>`<button class="chip ${c===cat?'active':''}" onclick="cat='${c}';render()">${c}</button>`).join('');let arr=data.filter(x=>cat==='全部'||x.category===cat).filter(x=>!st||status(x)===st).filter(x=>!q||Object.values(x).flat().join(' ').toLowerCase().includes(q));arr.sort((a,b)=>sort==='stock'?b.stock-a.stock:(a.name||'').localeCompare(b.name||'','zh-CN'));document.getElementById('count').textContent=`${arr.length} 个商品`;document.getElementById('results').innerHTML=arr.length?arr.map(card).join(''):`<div class="empty" style="grid-column:1/-1">没有找到匹配库存<br><small>试试商品名、型号、SN 或条码</small></div>`;stats()}
function card(x){const s=status(x),label=s==='out'?'缺货':s==='low'?'库存偏低':'有货';return `<article class="product"><div class="phead"><div><div class="name">${esc(x.name||'未命名商品')}</div><div class="model">${esc(x.model||'')} · ${esc(x.spec||'')}</div></div><span class="badge ${s}">${label}</span></div><div class="grid"><div class="cell"><b>${x.stock||0}</b><span>当前库存</span></div><div class="cell"><b>${x.available??x.stock??0}</b><span>可售</span></div><div class="cell"><b>${x.transit||0}</b><span>在途</span></div></div><div class="colors">${(x.colors||[]).map(c=>`<span class="color">● ${esc(c)}</span>`).join('')||'<span class="color">暂无颜色库存</span>'}</div><div class="actions"><button class="primary" onclick='detail(${JSON.stringify(x).replaceAll("'","&#39;")})'>查看详情</button><button onclick='copyStock(${JSON.stringify(x).replaceAll("'","&#39;")})'>复制给客户</button></div></article>`}
function stats(){document.getElementById('total').textContent=data.reduce((n,x)=>n+(+x.stock||0),0);document.getElementById('sale').textContent=data.reduce((n,x)=>n+(+(x.available??x.stock)||0),0);document.getElementById('warn').textContent=data.filter(x=>status(x)==='low').length;document.getElementById('out').textContent=data.filter(x=>status(x)==='out').length}
function detail(x){alert(`${x.name}\n型号：${x.model||'-'}\n规格：${x.spec||'-'}\n库存：${x.stock||0}\n可售：${x.available??x.stock??0}\n预留：${x.reserved||0}\n在途：${x.transit||0}\n${x.sn?'SN：'+x.sn:''}\n${x.barcode?'条码：'+x.barcode:''}`)}
function copyStock(x){const n=x.available??x.stock??0;const text=n>0?`${x.name} ${x.spec||''} 目前有货，可售${n}台，如需可以帮您预留。`:`${x.name} ${x.spec||''} 目前暂无现货，目前在途${x.transit||0}台。`;navigator.clipboard?.writeText(text);toast('已复制客户回复')}
function setStatus(s){document.getElementById('status').value=s;render();scrollTo({top:250,behavior:'smooth'})}function showRecent(){toast('最近查询功能已预留，可接入 localStorage')};function focusSearch(){document.getElementById('q').focus()};function sync(){toast('数据刷新入口已就绪，可接入你的真实库存接口')};function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}render();
</script></body></html>
