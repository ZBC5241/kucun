<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>库存查询 · 实时</title>
<style>
  :root{
    --purple:#6c5ce7; --purple-d:#5b4bd6; --orange:#ff9f43; --bg:#f4f5fb;
    --card:#ffffff; --line:#ececf3; --txt:#23233a; --sub:#8a8aa0; --red:#ff5b5b; --green:#26c281;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:640px;margin:0 auto;padding:14px 14px 40px}
  header{display:flex;align-items:center;gap:8px;padding:6px 2px 12px}
  header .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--purple),var(--orange));
    color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
  header h1{font-size:18px;margin:0;font-weight:800}
  header .t{margin-left:auto;font-size:11px;color:var(--sub)}
  .tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:4px;margin-bottom:14px}
  .tab{flex:1;text-align:center;padding:10px 0;border-radius:10px;font-weight:700;font-size:14px;color:var(--sub);cursor:pointer}
  .tab.on{background:var(--purple);color:#fff;box-shadow:0 4px 12px rgba(108,92,231,.28)}
  .search{display:flex;gap:8px;margin-bottom:12px}
  .search input{flex:1;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:15px;background:var(--card);outline:none}
  .search input:focus{border-color:var(--purple)}
  .search button{border:0;border-radius:12px;background:var(--purple);color:#fff;font-weight:800;
    padding:0 20px;font-size:15px;cursor:pointer}
  .search button:active{background:var(--purple-d)}
  .hint{font-size:12px;color:var(--sub);margin:-6px 2px 12px;line-height:1.5}
  .stat{display:flex;gap:10px;margin-bottom:12px}
  .stat .box{flex:1;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 14px}
  .stat .box .k{font-size:12px;color:var(--sub)}
  .stat .box .v{font-size:22px;font-weight:800;margin-top:2px}
  .stat .box .v.big{color:var(--purple)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:10px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:#fafaff;color:var(--sub);font-weight:700;font-size:12px;position:sticky;top:0}
  td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
  td.num.zero{color:var(--sub);font-weight:600}
  tr:last-child td{border-bottom:0}
  .wh{font-weight:700}
  .bar{height:6px;border-radius:4px;background:var(--purple);margin-top:5px;opacity:.5}
  .empty,.err{padding:26px 16px;text-align:center;color:var(--sub);font-size:14px;background:var(--card);
    border:1px solid var(--line);border-radius:13px}
  .err{color:var(--red)}
  .rec{border:1px solid var(--line);border-radius:13px;background:var(--card);padding:12px 14px;margin-bottom:10px}
  .rec .row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:13px;border-bottom:1px dashed var(--line)}
  .rec .row:last-child{border-bottom:0}
  .rec .row .k{color:var(--sub);flex:0 0 96px}
  .rec .row .v{font-weight:600;text-align:right;word-break:break-all}
  .loading{text-align:center;color:var(--sub);padding:22px;font-size:13px}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--purple);
    border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .pill{display:inline-block;background:#f0eeff;color:var(--purple);font-size:11px;font-weight:700;
    padding:2px 8px;border-radius:20px;margin-left:6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">库</div>
    <h1>库存实时查询</h1>
    <div class="t" id="ts">—</div>
  </header>

  <div class="tabs">
    <div class="tab on" data-tab="stock">📦 库存查询</div>
    <div class="tab" data-tab="trace">🔍 串码追踪</div>
  </div>

  <!-- 库存查询 -->
  <section id="p-stock">
    <div class="search">
      <input id="kw" type="search" placeholder="输入产品名 / SKU，如：Mate 70、Sound Joy2" autocomplete="off" />
      <button id="go">查询</button>
    </div>
    <div class="hint">按产品名实时查各仓现存量，卖货发现没货 → 看哪家店有、有几台 → 决定调货。</div>
    <div id="stock-out"></div>
  </section>

  <!-- 串码追踪 -->
  <section id="p-trace" style="display:none">
    <div class="search">
      <input id="csn" type="search" placeholder="输入串码 / SN，如：8688..." autocomplete="off" />
      <button id="goT">追踪</button>
    </div>
    <div class="hint">查一台机的流向：从哪进来、调去哪、当前在谁手上，判断调货周期。</div>
    <div id="trace-out"></div>
  </section>
</div>

<script>
// API 地址自动判定：本地双击打开(file://)→ 走 Mac 本地代理；部署到站点 → 走 Vercel 代理
// 若把界面部署在 GitHub Pages、代理在 Vercel 且项目名不是 kucun，改这一行即可
const API_BASE = window.KUCUN_API_BASE
  || (location.protocol === 'file:' ? 'http://127.0.0.1:8787' : 'https://kucun.vercel.app');

document.getElementById('ts').textContent = new Date().toLocaleString('zh-CN', {hour12:false});

// tab 切换
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    const tab=t.dataset.tab;
    document.getElementById('p-stock').style.display = tab==='stock'?'block':'none';
    document.getElementById('p-trace').style.display = tab==='trace'?'block':'none';
  };
});

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function api(path){
  const url = API_BASE ? (API_BASE.replace(/\/$/,'') + path) : path;
  const r = await fetch(url, {headers:{'Accept':'application/json'}});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

/* ---------- 库存查询 ---------- */
const stockOut = document.getElementById('stock-out');
function renderStock(json){
  const list = (json && json.data) || [];
  if(!list.length){
    stockOut.innerHTML = '<div class="empty">没有查到「'+esc(curKw)+'」的库存<br>试试更精确的产品名，或确认是否在本系统覆盖范围内</div>';
    return;
  }
  const total = list.reduce((s,r)=>s + (Number(r.currentqty)||0), 0);
  const whs = new Set(list.map(r=>r.warehouseName)).size;
  const prods = new Set(list.map(r=>r.productskuName)).size;
  const max = Math.max(...list.map(r=>Number(r.currentqty)||0), 1);
  const rows = list.slice().sort((a,b)=>(Number(b.currentqty)||0)-(Number(a.currentqty)||0));
  const cap = 500;
  const show = rows.slice(0, cap);
  let html = '';
  html += '<div class="stat">'
    + '<div class="box"><div class="k">产品数</div><div class="v">'+prods+'</div></div>'
    + '<div class="box"><div class="k">有货仓库</div><div class="v">'+whs+'</div></div>'
    + '<div class="box"><div class="k">总现存量</div><div class="v big">'+total+'</div></div>'
    + '</div>';
  if(prods===1){
    html += '<div class="card"><table><thead><tr><th>仓库</th><th style="text-align:right">现存量</th></tr></thead><tbody>';
    for(const r of show){
      const q = Number(r.currentqty)||0;
      html += '<tr><td><div class="wh">'+esc(r.warehouseName)+'</div>'
        + (r.manageClassName?'<div style="font-size:11px;color:var(--sub)">'+esc(r.manageClassName)+'</div>':'')
        + '<div class="bar" style="width:'+Math.max(6,Math.round(q/max*100))+'%"></div></td>'
        + '<td class="num'+(q===0?' zero':'')+'">'+q+'</td></tr>';
    }
    html += '</tbody></table></div>';
  } else {
    // 多产品：展示 产品|仓库|现存量
    html += '<div class="card"><table><thead><tr><th>产品</th><th>仓库</th><th style="text-align:right">现存量</th></tr></thead><tbody>';
    for(const r of show){
      const q = Number(r.currentqty)||0;
      html += '<tr><td>'+esc(r.productskuName)+'</td><td>'+esc(r.warehouseName)+'</td>'
        + '<td class="num'+(q===0?' zero':'')+'">'+q+'</td></tr>';
    }
    html += '</tbody></table></div>';
  }
  if(list.length>cap) html += '<div class="hint">仅显示前 '+cap+' 条，建议输入更精确的产品名缩小范围。</div>';
  stockOut.innerHTML = html;
}

let curKw='';
async function doStock(){
  curKw = document.getElementById('kw').value.trim();
  if(!curKw){ stockOut.innerHTML='<div class="empty">请输入产品名或 SKU</div>'; return; }
  stockOut.innerHTML = '<div class="loading"><span class="spin"></span>查询中…</div>';
  try{
    const json = await api('/stock?keyword='+encodeURIComponent(curKw));
    renderStock(json);
  }catch(e){
    stockOut.innerHTML = '<div class="err">查询失败：'+esc(e.message)+'<br>代理服务未启动或网络不通</div>';
  }
}
document.getElementById('go').onclick = doStock;
document.getElementById('kw').addEventListener('keydown', e=>{ if(e.key==='Enter') doStock(); });

/* ---------- 串码追踪 ---------- */
const traceOut = document.getElementById('trace-out');
const LABELS = {
  csn:'串码', sn:'串码',
  productName:'产品', productskuName:'产品', productskuCode:'物料编码',
  product_cName:'商品', product_cCode:'商品编码', productsku_cName:'SKU',
  warehouseName:'仓库', warehouse_name:'仓库', fromWarehouse:'调出仓', toWarehouse:'调入仓',
  billNo:'单据号', billCode:'单据号', code:'单据编号',
  billType:'单据类型', receipttype_name:'单据类型',
  bustype_name:'业务类型',
  status:'状态', state:'状态',
  operName:'操作人', operator:'操作人',
  operTime:'操作时间', createTime:'时间', time:'时间', auditTime:'审核时间',
  qty:'数量', remark:'备注', note:'备注',
  company:'公司', org:'组织', direction:'流向'
};
function renderTrace(json){
  const list = (json && (json.recordList || json.data)) || [];
  if(!list.length){
    traceOut.innerHTML = '<div class="empty">没有查到该串码的流转记录<br>确认串码是否正确，或该机尚未入系统</div>';
    return;
  }
  let html = '<div class="stat"><div class="box"><div class="k">流转记录</div><div class="v big">'+list.length+'</div></div>'
    + '<div class="box"><div class="k">串码</div><div class="v" style="font-size:14px">'+esc(json.csn||curCsn)+'</div></div></div>';
  // 汇总当前状态（若第一条有状态/仓库）
  html += '<div class="card" style="padding:12px 14px;font-size:13px">';
  const first = list[0];
  const curWh = first.warehouse_name || first.warehouseName || first.toWarehouse || first.fromWarehouse;
  const curSt = first.receipttype_name || first.status || first.state;
  if(curWh) html += '当前位置：<b>'+esc(curWh)+'</b><br>';
  if(curSt) html += '当前状态：<b>'+esc(curSt)+'</b>';
  html += '</div>';
  for(const rec of list){
    html += '<div class="rec">';
    const keys = Object.keys(rec).filter(k=>rec[k]!=='' && rec[k]!=null);
    if(!keys.length) html += '<div style="color:var(--sub)">（空记录）</div>';
    for(const k of keys){
      const label = LABELS[k] || k;
      html += '<div class="row"><span class="k">'+esc(label)+'</span><span class="v">'+esc(rec[k])+'</span></div>';
    }
    html += '</div>';
  }
  traceOut.innerHTML = html;
}
let curCsn='';
async function doTrace(){
  curCsn = document.getElementById('csn').value.trim();
  if(!curCsn){ traceOut.innerHTML='<div class="empty">请输入串码 / SN</div>'; return; }
  traceOut.innerHTML = '<div class="loading"><span class="spin"></span>追踪中…</div>';
  try{
    const json = await api('/trace?csn='+encodeURIComponent(curCsn));
    renderTrace(json);
  }catch(e){
    traceOut.innerHTML = '<div class="err">追踪失败：'+esc(e.message)+'<br>代理服务未启动或网络不通</div>';
  }
}
document.getElementById('goT').onclick = doTrace;
document.getElementById('csn').addEventListener('keydown', e=>{ if(e.key==='Enter') doTrace(); });
</script>
</body>
</html>
