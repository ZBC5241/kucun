<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b6cff"><title>库存工作台 V3.0</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="wrap"><div class="bar"><div><div class="brand">库存工作台 <b>V3.0</b></div><div class="sub">真实库存 · 智能查询 · 门店快速定位</div></div><button class="ghost" id="reset">重置</button></div><div class="search"><input id="q" autocomplete="off" placeholder="搜索商品 / 型号 / 内存 / 颜色 / 商品编码"><button id="go">查询</button></div><div class="tips">示例：Mate70Pro　512白　Pura80　FreeBuds　商品编码</div></div></header><main class="wrap main"><section class="stats"><div><b id="items">0</b><span>商品记录</span></div><div><b id="warehouses">0</b><span>仓库/门店</span></div><div><b id="stock">0</b><span>总库存</span></div><div><b id="avail">0</b><span>可用库存</span></div></section><section class="filters"><div id="cats" class="chips"></div><div class="filterrow"><select id="wh"><option value="">全部仓库 / 门店</option></select><select id="type"><option value="">全部库存</option><option value="available">有可用库存</option><option value="demo">仅演示机</option></select><select id="sort"><option value="smart">智能排序</option><option value="a">可用库存</option><option value="q">总库存</option></select></div></section><section class="headrow"><h2 id="title">库存查询</h2><span id="count"></span></section><section id="summary" class="summary hidden"></section><section id="results" class="results"></section></main><template id="empty"><div class="empty">没有找到匹配库存<br><small>试试：商品名、型号、内存、颜色或商品编码</small></div></template><div id="toast" class="toast"></div><script src="data.js"></script><script src="app.js"></script></body></html>
