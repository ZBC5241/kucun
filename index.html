    if(r.status===304)return {unchanged:true};
    const etag=r.headers.get('etag'),lm=r.headers.get('last-modified');
    if((etag&&etag===lastEtag)||(lm&&lm===lastLm&&!etag))return {unchanged:true};
    return {unchanged:false,etag,lm};
  }

  function extractRawArray(html){
    const m=html.match(/inventoryDataRaw\s*=\s*Array\.isArray\([^)]*\)\s*\?\s*[^:]*:\s*(\[[\s\S]*?\];)/);
    if(!m)return null;
    const arrText=m[1].replace(/;\s*$/,'');
    return JSON.parse(arrText);
  }

  async function fetchAndApply(){
    const r=await fetch(TARGET,{method:'GET',cache:'no-store',headers:{'Cache-Control':'no-cache'}});
    if(!r.ok)throw new Error('GET '+r.status);
    const html=await r.text();
    const arr=extractRawArray(html);
    if(!Array.isArray(arr)||!arr.length)throw new Error('extract empty');
    if(!__ljcApplyNewData(arr))throw new Error('apply failed');
  }

  // 应用新数据：重建索引 + 重跑当前查询 + 保留滚动位置。返回是否成功。
  function __ljcApplyNewData(rawArray){
    if(!Array.isArray(rawArray)||!rawArray.length)return false;
    inventoryData=rawArray.map(__ljcNormalizeRow).filter(r=>!EXCLUDED_WAREHOUSES.has(__ljcScrubDemoPrefix(r.wh)));
    QUERY_STORES=new Set([...inventoryData.map(r=>r.wh),...inventoryData.map(r=>QUERY_STORE_SCRUB(r.wh))]);
    __ljcCompleteStoreAliases();
    __ljcBuildSearchIndex(); // 内部已清空全部依赖数据缓存
    try{
      window.LJC_DATA_DIAGNOSTICS=Object.freeze({
        rawRows:rawArray.length,normalizedRows:inventoryData.length,
        missingIdentity:inventoryData.filter(r=>!r.code||!r.name||!r.wh).length,
        missingSaleableQuantity:inventoryData.filter(r=>r.a===null).length,
        note:'missingSaleableQuantity 行会按可售 0 处理，不允许回退到账面库存 q。'
      });
    }catch(e){}
    try{
      if(window.__queryAudit){window.__queryAudit.skuCatalog=skuCatalog;window.__queryAudit.scopedRows=scopedRows;window.__queryAudit.rowsByCode=rowsByCode;window.__queryAudit.QUERY_STORES=QUERY_STORES;window.__queryAudit.dataDiagnostics=window.LJC_DATA_DIAGNOSTICS;}
    }catch(e){}
    try{
      const y=window.scrollY;
      if(typeof render==='function')render();
      requestAnimationFrame(()=>window.scrollTo(0,y));
    }catch(e){console.warn('[kucun] 重渲染跳过',e);}
    return true;
  }

  async function probe(){
    const t=Date.now();
    if(probing||t-lastProbeTs<THROTTLE_MS)return;
    lastProbeTs=t;probing=true;
    try{
      const res=await headProbe();
      if(res.unchanged)return;
      if(Date.now()-lastAppliedTs<DEPLOY_GATE_MS)return; // 部署滞后保护
      await fetchAndApply();
      lastEtag=res.etag||lastEtag;lastLm=res.lm||lastLm;
      lastAppliedTs=Date.now();
      console.info('[kucun] 已静默更新到最新库存数据');
    }catch(err){
      console.warn('[kucun] 静默更新跳过：',err&&err.message?err.message:err);
    }finally{probing=false;}
  }

  // 首次探测：建立基线 etag（不立即换数据，避免重复下载当前版本）
  (async()=>{
    try{
      const r=await fetch(TARGET,{method:'HEAD',cache:'no-store',headers:{'Cache-Control':'no-cache'}});
      lastEtag=r.headers.get('etag');lastLm=r.headers.get('last-modified');
    }catch(e){console.warn('[kucun] 初始探测失败',e);}
    probe(); // 页面打开即探一次
  })();

  // 登录成功（html 加上 ljc-authenticated）后再探一次，确保此刻拿到最新
  if(window.MutationObserver){
    new MutationObserver(()=>{
      const now=document.documentElement.classList.contains('ljc-authenticated');
      if(now&&!authed){authed=true;probe();}
      if(!now)authed=false;
    }).observe(document.documentElement,{attributes:true,attributeFilter:['class']});
  }

  // 可见时每 60 秒；切回前台立即探一次；隐藏时停止轮询
  let iv=null;
  function startProbe(){if(iv)return;iv=setInterval(probe,PROBE_MS);}
  function stopProbe(){if(iv){clearInterval(iv);iv=null;}}
  if(document.visibilityState==='visible'){startProbe();probe();}
  else stopProbe();
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'){startProbe();probe();}
    else stopProbe();
  });
})();
</script>
